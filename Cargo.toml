[package]
name = "prune-lang"
version = "0.3.0"
authors = ["Anton Ping <antonping1999@gmail.com>"]
edition = "2024"
description = "Prune is a constraint logic programming language with branching heuristic."
readme = "README.md"
repository = "https://github.com/antonping/prune-lang"
license = "Apache-2.0"
keywords = ["logic-programming", "dsl", "prolog", "kanren", "smt"]
categories = ["command-line-utilities", "compilers"]

[[bin]]
name = "prune"
path = "src/main.rs"

[dependencies]
logos = "0.16.1"
snailquote = "0.3.1"
itertools = "0.15.0"
rand = "0.10.3"
easy-smt = "0.3.2"
clap = { version = "4.6.7", features = ["derive"] }
memory-stats = "1.2.0"

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.49.0", features = ["yaml"] }

[dev-dependencies.cargo-husky]
version = "1"
default-features = false # Disable features which are enabled by default
features = ["precommit-hook", "run-cargo-fmt", "run-cargo-check", "run-cargo-clippy"]

[[bench]]
name = "test_benches"
harness = false
